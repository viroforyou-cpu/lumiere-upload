<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumiere POS — Dashboard</title>
  <meta name="theme-color" content="#0e0e11">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
:root {
  --bg: #0a0d13;
  --bg2: #0e131b;
  --surface: #131a24;
  --surface2: #182130;
  --surface3: #1e2939;
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(232, 182, 76, 0.35);
  --gold: #e8b64c;
  --gold-soft: #f5d98e;
  --gold-deep: #c9962f;
  --gold-grad: linear-gradient(135deg, #f7dfa0 0%, #e8b64c 45%, #c9962f 100%);
  --teal: #37c8a8;
  --teal-soft: #a5e9d8;
  --rose: #e87ba0;
  --rose-soft: #f2c6d6;
  --violet: #8f7ee8;
  --blue: #5aa9e6;
  --orange: #f2a33c;
  --green: #3ddc97;
  --text: #eef1f6;
  --text-dim: #97a1b0;
  --ok: #3ddc97;
  --warn: #f2a33c;
  --danger: #f2606b;
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
  --shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.35);
  --radius: 18px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }

body {
  background:
    radial-gradient(1100px 480px at 85% -10%, rgba(232, 182, 76, 0.12), transparent 60%),
    radial-gradient(900px 420px at -5% 5%, rgba(55, 200, 168, 0.08), transparent 55%),
    radial-gradient(700px 380px at 60% 110%, rgba(143, 126, 232, 0.07), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}

::selection { background: rgba(232, 182, 76, 0.35); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(232, 182, 76, 0.22);
  border-radius: 999px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: rgba(232, 182, 76, 0.4); background-clip: content-box; }

/* ---------------- Topbar ---------------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 26px;
  background: rgba(14, 19, 27, 0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-dot {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--gold-grad);
  box-shadow: 0 0 24px rgba(232, 182, 76, 0.5);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.brand-dot::after {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 7px;
  background: var(--bg2);
}
.brand h1 {
  font-family: "Outfit", "Inter", sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 3px;
  background: var(--gold-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.topbar-actions { display: flex; gap: 12px; align-items: center; }

.day-label {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: rgba(24, 33, 48, 0.6);
}

.role-select {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: border-color 0.2s;
}
.role-select:focus { outline: 2px solid var(--gold); border-color: transparent; }

.lang-btn {
  background: transparent;
  color: var(--gold-soft);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}
.lang-btn:hover { background: rgba(232, 182, 76, 0.16); box-shadow: 0 0 16px rgba(232, 182, 76, 0.25); }

/* ---------------- Layout ---------------- */

.layout { display: flex; min-height: calc(100vh - 65px); }

.sidebar {
  width: 236px;
  flex-shrink: 0;
  background: rgba(14, 19, 27, 0.55);
  border-right: 1px solid var(--border);
  padding: 18px 12px;
  overflow-y: auto;
  position: sticky;
  top: 65px;
  height: calc(100vh - 65px);
}

.sidebar nav { display: flex; flex-direction: column; gap: 3px; }
.sidebar hr { border: none; border-top: 1px solid var(--border); margin: 12px 8px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: transparent;
  border: none;
  border-left: 3px solid transparent;
  color: var(--text-dim);
  text-align: left;
  padding: 11px 14px;
  font-size: 14px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
}
.nav-item svg { flex-shrink: 0; opacity: 0.7; transition: opacity 0.18s; }
.nav-item:hover { color: var(--text); background: rgba(255, 255, 255, 0.045); }
.nav-item:hover svg { opacity: 1; }
.nav-item.active {
  color: var(--gold-soft);
  background: linear-gradient(90deg, rgba(232, 182, 76, 0.16), rgba(232, 182, 76, 0.02));
  border-left-color: var(--gold);
  font-weight: 600;
}
.nav-item.active svg { opacity: 1; }
.nav-item.active::after {
  content: "";
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 10px var(--gold);
}
.nav-item.hidden { display: none; }

.view {
  flex: 1;
  padding: 28px 30px 56px;
  max-width: 1220px;
  margin: 0 auto;
  width: 100%;
  animation: fadeIn 0.35s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------------- Grid & cards ---------------- */

.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.card {
  background: linear-gradient(165deg, rgba(24, 33, 48, 0.85), rgba(14, 19, 27, 0.9));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-soft);
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--gold-grad);
  opacity: 0.55;
}
.card:hover {
  transform: translateY(-2px);
  border-color: var(--border-strong);
  box-shadow: var(--shadow);
}

.card h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  color: var(--text-dim);
  margin-bottom: 12px;
  font-weight: 700;
}

.chart-card { display: flex; flex-direction: column; }
.chart-card h3 { color: var(--gold-soft); }

.aq-wrap { margin-bottom: 20px; }
.aq-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 26px 0 10px;
}
.aq-head strong {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.3px;
}
.aq-actions { display: flex; gap: 8px; }
.aq-actions .btn.sm { padding: 5px 8px; }

.aq-group { margin-bottom: 26px; }
.aq-group-title {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--gold-soft);
  border: 1px solid var(--gold-dim);
  background: rgba(212, 175, 55, 0.06);
  border-radius: 999px;
  padding: 4px 14px;
  margin-bottom: 14px;
}
.starter-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 18px;
}
.starter-bar > span {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--muted);
}

/* ---------------- Metrics / KPI ---------------- */

.metric { position: relative; }
.metric-value {
  font-family: "Outfit", "Inter", sans-serif;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 0.5px;
  background: var(--gold-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1.1;
}
.metric-label { font-size: 13px; color: var(--text-dim); margin-top: 6px; font-weight: 500; }
.metric.good .metric-value { background: linear-gradient(135deg, #8cebbf, #3ddc97); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.metric.warn .metric-value { background: linear-gradient(135deg, #f7c878, #f2a33c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.metric.danger .metric-value { background: linear-gradient(135deg, #f9a3aa, #f2606b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.metric.teal .metric-value { background: linear-gradient(135deg, #9ae9d6, #37c8a8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.metric.violet .metric-value { background: linear-gradient(135deg, #b7acf5, #8f7ee8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

.metric.with-icon { display: flex; align-items: flex-start; gap: 14px; }
.metric-icon {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(232, 182, 76, 0.1);
  border: 1px solid var(--border);
  color: var(--gold-soft);
}
.metric-icon svg { width: 22px; height: 22px; }

/* ---------------- Tables ---------------- */

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left;
  color: var(--gold-soft);
  font-weight: 600;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
td { padding: 11px 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: var(--text); }
tr:hover td { background: rgba(255, 255, 255, 0.025); }
tbody tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; }

/* ---------------- Badges & pills ---------------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.badge::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 8px currentColor;
}
.badge.ok { background: rgba(61, 220, 151, 0.13); color: var(--ok); }
.badge.warn { background: rgba(242, 163, 60, 0.13); color: var(--warn); }
.badge.danger { background: rgba(242, 96, 107, 0.13); color: var(--danger); }
.badge.gold { background: rgba(232, 182, 76, 0.14); color: var(--gold-soft); }
.badge.dim { background: rgba(151, 161, 176, 0.13); color: var(--text-dim); }
.badge.teal { background: rgba(55, 200, 168, 0.14); color: var(--teal-soft); }

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
  letter-spacing: 0.5px; text-transform: uppercase;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.pill.open { background: rgba(61, 220, 151, 0.14); color: var(--ok); }
.pill.closed { background: rgba(242, 96, 107, 0.14); color: var(--danger); }

/* ---------------- Toolbar ---------------- */

.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.toolbar .spacer { flex: 1; }
.toolbar h2 {
  font-family: "Outfit", "Inter", sans-serif;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.5px;
  background: var(--gold-grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* ---------------- Forms & buttons ---------------- */

input, select, textarea {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.15); }

.btn {
  background: var(--gold-grad);
  color: #16160e;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.3px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(232, 182, 76, 0.3);
  transition: all 0.2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(232, 182, 76, 0.42); }
.btn:active { transform: translateY(0); }
.btn.ghost {
  background: transparent;
  color: var(--gold-soft);
  border: 1px solid var(--border-strong);
  box-shadow: none;
}
.btn.ghost:hover { background: rgba(232, 182, 76, 0.12); box-shadow: 0 0 14px rgba(232, 182, 76, 0.2); }
.btn.danger {
  background: transparent;
  color: var(--danger);
  border: 1px solid rgba(242, 96, 107, 0.5);
  box-shadow: none;
}
.btn.danger:hover { background: rgba(242, 96, 107, 0.12); box-shadow: 0 0 14px rgba(242, 96, 107, 0.2); }
.btn.sm { padding: 6px 9px; border-radius: 8px; line-height: 1; }
.btn.sm svg { vertical-align: -2px; }
.btn.ok {
  background: transparent;
  color: var(--ok);
  border: 1px solid rgba(61, 220, 151, 0.5);
  box-shadow: none;
}
.btn.ok:hover { background: rgba(61, 220, 151, 0.12); box-shadow: 0 0 14px rgba(61, 220, 151, 0.2); }
.btn.warn {
  background: transparent;
  color: var(--warn);
  border: 1px solid rgba(242, 163, 60, 0.5);
  box-shadow: none;
}
.btn.warn:hover { background: rgba(242, 163, 60, 0.12); box-shadow: 0 0 14px rgba(242, 163, 60, 0.2); }

.appt-summary {
  padding: 12px 16px;
  color: var(--text-dim);
  font-size: 13px;
  border-top: 1px solid var(--border);
}

.reorder-panel { margin-bottom: 16px; }
.reorder-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
}
.reorder-row:last-child { border-bottom: none; }
.reorder-name { flex: 1; font-weight: 600; }

.toast-wrap {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: rgba(22, 22, 14, 0.95);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--gold-soft);
  color: var(--text);
  padding: 11px 16px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 600;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.2s, transform 0.2s;
  max-width: 320px;
}
.toast.show { opacity: 1; transform: translateY(0); }

.nl-suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12.5px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.chip:hover { border-color: var(--gold-soft); color: var(--gold-soft); }
.nl-confirm {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  background: rgba(55, 200, 168, 0.12);
  border: 1px solid rgba(55, 200, 168, 0.35);
  color: var(--teal-soft);
  font-size: 13px;
  font-weight: 600;
}

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-field label {
  display: block;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
}
.form-field select, .form-field input { width: 100%; }
.form-field.full { grid-column: 1 / -1; }

.form-card { margin-bottom: 16px; }
.form-title { font-size: 15px; font-weight: 700; color: var(--gold-soft); margin-bottom: 14px; }
.form-actions { display: flex; gap: 10px; margin-top: 16px; }

.rate-input { width: 90px; text-align: center; padding: 7px 8px; }

/* ---------------- Section titles ---------------- */

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 17px;
  font-weight: 700;
  color: var(--gold-soft);
  margin: 30px 0 14px;
  letter-spacing: 0.4px;
}
.section-title::before {
  content: "";
  width: 4px;
  height: 20px;
  border-radius: 4px;
  background: var(--gold-grad);
  box-shadow: 0 0 10px rgba(232, 182, 76, 0.5);
}
.section-title:first-of-type { margin-top: 0; }

.muted { color: var(--text-dim); font-size: 13px; }

/* ---------------- Search / segmented controls ---------------- */

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 12px;
  color: var(--text-dim);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.15); }
.search-box input { border: none; background: transparent; padding: 10px 0; width: 220px; }
.search-box input:focus { outline: none; box-shadow: none; }

.seg { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; gap: 4px; }
.seg-btn {
  background: transparent; color: var(--text-dim); border: none;
  padding: 8px 18px; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
  border-radius: 9px; cursor: pointer; transition: all 0.2s;
}
.seg-btn:hover { color: var(--text); }
.seg-btn.active { background: var(--gold-grad); color: #16160e; box-shadow: 0 4px 14px rgba(232, 182, 76, 0.35); }

/* ---------------- Charts ---------------- */

.chart { width: 100%; height: auto; }
.chart-label { font-size: 11px; fill: var(--text-dim); font-weight: 600; }
.chart-axis { font-size: 10px; fill: var(--text-dim); }
.chart-card svg { margin-top: 6px; }

.chart-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-dim);
}
.cl-item { display: inline-flex; align-items: center; gap: 6px; }
.cl-dot { width: 10px; height: 10px; border-radius: 3px; }

.donut-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.donut-svg { position: relative; flex-shrink: 0; }
.donut-center {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 800; color: var(--gold-soft); pointer-events: none;
}
.donut-legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
.donut-legend-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.donut-legend-row .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.donut-legend-row .lk { flex: 1; color: var(--text); }
.donut-legend-row .lv { color: var(--gold-soft); font-weight: 700; }

.hbar-list { display: flex; flex-direction: column; gap: 12px; }
.hbar-row { display: grid; grid-template-columns: 130px 1fr 70px; gap: 12px; align-items: center; font-size: 13px; }
.hbar-label { color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-label em { color: var(--gold-soft); font-style: normal; font-weight: 700; margin-right: 2px; }
.hbar-track { height: 10px; background: rgba(255, 255, 255, 0.06); border-radius: 6px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 6px; transition: width 0.6s ease; box-shadow: 0 0 10px rgba(232, 182, 76, 0.25); }
.hbar-value { text-align: right; color: var(--text); font-weight: 700; }

/* ---------------- Heatmap ---------------- */

.heatmap {
  display: flex;
  flex-direction: column;
  gap: 5px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.hm-row { display: flex; gap: 5px; align-items: center; }
.hm-cell {
  flex-shrink: 0;
  min-width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
}
.hm-label {
  min-width: 74px;
  justify-content: flex-start;
  color: var(--text-dim);
  font-weight: 600;
  font-size: 12px;
}
.hm-col { color: var(--text-dim); font-size: 11px; height: 22px; }
.hm-val { color: #fff; transition: transform 0.15s; }
.hm-val:hover { transform: scale(1.08); }

/* ---------------- Appointments / misc ---------------- */

.appointment-row {
  display: grid;
  grid-template-columns: 110px 1fr 1fr 1fr 120px;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  transition: background 0.15s;
}
.appointment-row:hover { background: rgba(255, 255, 255, 0.03); }
.appointment-row.time { color: var(--gold-soft); font-weight: 700; }

.day-check { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.day-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px;
  font-size: 12px; color: var(--text-dim); cursor: pointer; transition: all 0.15s;
}
.day-chip:has(input:checked) { border-color: var(--gold); color: var(--gold-soft); background: rgba(232, 182, 76, 0.1); }
.day-chip input { accent-color: var(--gold); }

.rule-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px; cursor: pointer;
}
.rule-row:last-child { border-bottom: none; }
.rule-row input { accent-color: var(--gold); transform: scale(1.15); cursor: pointer; }

/* ---------------- Closed overlay ---------------- */

.closed-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(1000px 500px at 50% -20%, rgba(232, 182, 76, 0.12), transparent 60%),
    rgba(8, 11, 17, 0.96);
  backdrop-filter: blur(6px);
}
.closed-card { text-align: center; padding: 40px 50px; }
.closed-card .brand { justify-content: center; margin-bottom: 22px; }
.closed-icon { color: var(--gold); margin: 10px 0 8px; }
.closed-card h2 { font-size: 30px; font-weight: 800; letter-spacing: 2px; color: var(--gold-soft); margin-bottom: 14px; }
.closed-clock { font-family: "Outfit", sans-serif; font-size: 52px; font-weight: 800; letter-spacing: 4px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-variant-numeric: tabular-nums; }
.closed-date { color: var(--text-dim); font-size: 15px; margin-top: 8px; text-transform: capitalize; }
.closed-open { color: var(--text); font-size: 16px; margin: 18px 0 26px; }
.closed-open::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); margin-right: 8px; }

/* ---------------- Responsive ---------------- */

@media (max-width: 900px) {
  .layout { flex-direction: column; }
  .sidebar {
    width: 100%;
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 12px;
  }
  .sidebar nav { flex-direction: row; flex-wrap: wrap; }
  .nav-item { border-left: none; border-bottom: 3px solid transparent; }
  .nav-item.active { border-bottom-color: var(--gold); border-left: none; }
  .nav-item.active::after { display: none; }
  .view { padding: 20px 16px 44px; }
  .form-row { grid-template-columns: 1fr; }
  .appointment-row { grid-template-columns: 80px 1fr 1fr; }
  .topbar { padding: 12px 16px; }
  .day-label { display: none; }
}
</style>

  function table(rows, opts) {
    opts = opts || {};

  function colorFor(i) { return CHART_COLORS[i % CHART_COLORS.length]; }

  function timeChart(labels, values, opts) {
    opts = opts || {};
    var id = opts.id || "chart";
    var col = PERIOD_COLORS[opts.period || "daily"];
    var W = 600, H = 250, padB = 36, padT = 28, padL = 10, padR = 10;
    var max = Math.max.apply(null, values.concat([1]));
    var n = labels.length;
    var c1 = col.c1, c2 = col.c2;
    var body = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img">' +
      '<defs><linearGradient id="' + id + '_g" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + c2 + '"/><stop offset="100%" stop-color="' + c1 + '"/></linearGradient>' +
      '<linearGradient id="' + id + '_fill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + c1 + '" stop-opacity="0.55"/><stop offset="100%" stop-color="' + c1 + '" stop-opacity="0.05"/></linearGradient></defs>';

    if (opts.type === "line") {
      var step = (W - padL - padR) / (n - 1 || 1);
      var pts = values.map(function (v, i) {
        return [padL + i * step, H - padB - (v / max) * (H - padB - padT)];
      });
      var area = "M " + pts[0][0] + " " + (H - padB) + " L " + pts.map(function (p) { return p[0] + " " + p[1]; }).join(" L ") + " L " + pts[n - 1][0] + " " + (H - padB) + " Z";
      var line = pts.map(function (p) { return p[0] + "," + p[1]; }).join(" ");
      body += '<path d="' + area + '" fill="url(#' + id + '_fill)"/>' +
        '<polyline points="' + line + '" fill="none" stroke="' + c1 + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
      pts.forEach(function (p, i) {
        body += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + c1 + '" stroke="#0e131b" stroke-width="2">' +
          '<title>' + esc(labels[i] + ": " + compact(values[i])) + '</title></circle>' +

      });
    } else {
      var bw = (W - padL - padR) / n;
      values.forEach(function (v, i) {
        var h = (v / max) * (H - padB - padT);
        var x = padL + i * bw + bw * 0.16;
        var y = H - padB - h;
        var w = bw * 0.68;
        body += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + Math.max(h, 2) + '" rx="5" fill="url(#' + id + '_g)">' +
          '<title>' + esc(labels[i] + ": " + compact(v)) + '</title></rect>' +
          '<text x="' + (x + w / 2) + '" y="' + (y - 6) + '" text-anchor="middle" class="chart-label">' + compact(v) + '</text>' +
          '<text x="' + (x + w / 2) + '" y="' + (H - padB + 16) + '" text-anchor="middle" class="chart-axis">' + esc(labels[i]) + '</text>';
      });
    }
    body += '</svg>';
    return body;
  }

  function donutChart(parts, opts) {
    opts = opts || {};
    var r = 70, cx = 80, cy = 80, stroke = 26;
    var total = sum(parts.map(function (p) { return p.value; }));
    var C = 2 * Math.PI * r;
    var offset = 0;
    var circles = "";
    var legend = "";
    if (!total) return '<p class="muted">' + t("pending") + '</p>';
    parts.forEach(function (p, i) {
      var color = p.color || DONUT_COLORS[i % DONUT_COLORS.length];
      var len = (p.value / total) * C;
      var rot = (offset / total) * 360 - 90;
      circles += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-dasharray="' + len.toFixed(2) + ' ' + (C - len).toFixed(2) + '" transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')"/>';
      offset += p.value;
      legend += '<div class="donut-legend-row"><span class="dot" style="background:' + color + '"></span><span class="lk">' + esc(p.label) + '</span><span class="lv">' + p.valueText + '</span></div>';
    });
    var pct = parts.length ? Math.round((parts[0].value / total) * 100) : 0;
    return '<div class="donut-wrap">' +
      '<div class="donut-svg"><svg viewBox="0 0 160 160" width="150" height="150">' + circles + '</svg>' +
      '<div class="donut-center"><div>' + pct + '%</div></div></div>' +
      '<div class="donut-legend">' + legend + '</div></div>';
  }

    opts = opts || {};
    if (!items.length) return '<p class="muted">' + t("pending") + '</p>';
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    var color = (opts.period && PERIOD_COLORS[opts.period] ? PERIOD_COLORS[opts.period].c1 : "#e8b64c");
    var html = '<div class="hbar-list">';
    items.forEach(function (it, i) {
      var pct = Math.max((it.value / max) * 100, 3);
      html += '<div class="hbar-row"><span class="hbar-label">' + (opts.index ? '<em>' + (i + 1) + '.</em> ' : "") + esc(it.label) + '</span>' +
        '<div class="hbar-track"><div class="hbar-fill" style="width:' + pct + '%;background:linear-gradient(90deg,' + color + ',' + (opts.period ? PERIOD_COLORS[opts.period].c2 : "#f7dfa0") + ')"></div></div>' +
        '<span class="hbar-value">' + (it.valueText || fmt(it.value)) + '</span></div>';
    });
    return html + '</div>';
  }

  function multiBarChart(labels, series, opts) {
    opts = opts || {};
    var W = 620, H = 250, padB = 38, padT = 26, padL = 46, padR = 12;
    var n = labels.length, m = series.length;
    var totals = labels.map(function (_, i) { return sum(series.map(function (s) { return s.values[i] || 0; })); });
    var max = Math.max.apply(null, totals.concat([1]));
    var body = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img">';
    var g;
    for (g = 0; g <= 4; g++) {
      var val = max * g / 4;
      var y = H - padB - (g / 4) * (H - padB - padT);
      body += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="rgba(255,255,255,0.07)"/>';
      body += '<text x="' + (padL - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="chart-axis">' + compact(val) + '</text>';
    }
    var gw = (W - padL - padR) / Math.max(n, 1);
    var bw = opts.stacked ? gw * 0.6 : Math.min(gw * 0.7 / Math.max(m, 1), 44);
    for (var i = 0; i < n; i++) {
      var cx = padL + i * gw + gw / 2;
      if (opts.stacked) {
        var yTop = H - padB;
        var stacked = 0;
        for (var si = 0; si < m; si++) {
          var v = series[si].values[i] || 0;
          if (!v) continue;
          var h = (v / max) * (H - padB - padT);
          var col = series[si].color || colorFor(si);
          yTop -= h;
          body += '<rect x="' + (cx - bw / 2) + '" y="' + yTop + '" width="' + bw + '" height="' + Math.max(h, 1) + '" rx="4" fill="' + col + '" opacity="0.92"><title>' + esc(labels[i] + " · " + series[si].name + ": " + (opts.fmt || fmt)(v)) + '</title></rect>';
          stacked += v;
        }
        if (stacked) body += '<text x="' + cx + '" y="' + (H - padB - (stacked / max) * (H - padB - padT) - 8) + '" text-anchor="middle" class="chart-label">' + compact(stacked) + '</text>';
      } else {
        var x0 = cx - (m * bw + Math.max(m - 1, 0) * 4) / 2;
        for (var sj = 0; sj < m; sj++) {
          var v2 = series[sj].values[i] || 0;
          var h2 = (v2 / max) * (H - padB - padT);
          var x = x0 + sj * (bw + 4);
          body += '<rect x="' + x + '" y="' + (H - padB - h2) + '" width="' + bw + '" height="' + Math.max(h2, 1) + '" rx="4" fill="' + (series[sj].color || colorFor(sj)) + '" opacity="0.9"><title>' + esc(labels[i] + " · " + series[sj].name + ": " + (opts.fmt || fmt)(v2)) + '</title></rect>';
        }
      }
      body += '<text x="' + cx + '" y="' + (H - padB + 18) + '" text-anchor="middle" class="chart-axis">' + esc(labels[i]) + '</text>';
    }
    body += '</svg>';
    body += '<div class="chart-legend">' + series.map(function (s, k) {
      return '<span class="cl-item"><span class="cl-dot" style="background:' + (s.color || colorFor(k)) + '"></span>' + esc(s.name) + '</span>';
    }).join("") + '</div>';
    return body;
  }

  function heatColor(pct) {
    var a = 0.18 + pct * 0.75;
    return "rgba(232, 182, 76, " + a.toFixed(3) + ")";
  }

  function heatmapChart(rows, cols, opts) {
    opts = opts || {};
    var max = 1;
    rows.forEach(function (r) { r.values.forEach(function (v) { if (v > max) max = v; }); });
    var html = '<div class="heatmap">';
    html += '<div class="hm-row"><div class="hm-cell hm-label"></div>' + cols.map(function (c) { return '<div class="hm-cell hm-col">' + esc(c) + '</div>'; }).join("") + '</div>';
    rows.forEach(function (r) {
      html += '<div class="hm-row"><div class="hm-cell hm-label">' + esc(r.label) + '</div>';
      r.values.forEach(function (v, i) {
        var pct = max ? v / max : 0;
        var col = v ? heatColor(pct) : "rgba(255,255,255,0.03)";
        html += '<div class="hm-cell hm-val" style="background:' + col + '"' +
          (v ? ' title="' + esc(r.label + " " + cols[i] + ": " + fmt(v) + " ARS") + '"' : "") + '>' + (v ? compact(v) : "") + '</div>';
      });
      html += '</div>';
    });
    return html + '</div>';
  }

  function toast(msg) {
    try {
      if (typeof document === "undefined" || !document.body) return;
      var wrap = document.getElementById("toastWrap");
      if (!wrap) {
        wrap = document.createElement("div");
        wrap.id = "toastWrap";
        wrap.className = "toast-wrap";
        document.body.appendChild(wrap);
      }
      var el = document.createElement("div");
      el.className = "toast";
      el.textContent = msg;
      wrap.appendChild(el);
      if (el.classList) { el.classList.add("show"); }
      setTimeout(function () { if (el.classList) el.classList.remove("show"); if (el.remove) el.remove(); }, 2600);
    } catch (e) {}
  }

  function daySummary(day) {
    var tickets = D.tickets.filter(function (t) { return t.date === day; });
    var revenue = sum(tickets.map(ticketTotal));
    var products = sum(tickets.map(function (t) { return sum(ticketProducts(t).map(function (l) { return l.q; })); }));
    var newClients = D.clients.filter(function (c) { return c.first_visit === day; }).length;
    var returning = tickets.filter(isReturning).length;
    var payments = {};
    tickets.forEach(function (t) { t.payments.forEach(function (p) { payments[p.m] = (payments[p.m] || 0) + p.a; }); });
    return { tickets: tickets.length, revenue: revenue, products: products, newClients: newClients, returning: returning, payments: payments, noShows: D.noShows[day] || 0 };
  }

  function renderRetention() {
    var w30 = 0, w60 = 0, total = 0;
    D.clients.forEach(function (c) {
      if ((c.visits || []).length < 2) return;
      total++;
      var diff = daysBetween(c.first_visit, c.visits[1]);
      if (diff <= 30) w30++;
      if (diff <= 60) w60++;
    });
    return [
      ["", "1 " + t("week_label").toLowerCase() + " / mes", "2 meses"],
      [t("returning_after_1_2_months"), (total ? Math.round(w30 / total * 100) : 0) + "%", (total ? Math.round(w60 / total * 100) : 0) + "%"]
    ];

  function renderCommission(tickets) {
    tickets = tickets || D.tickets.filter(inMonth);
    var rows = [["Staff", t("services"), t("revenue_ars"), t("commission_totals")]];
    Object.keys(D.commissionRates).forEach(function (id) {
      var rate = D.commissionRates[id];
      var own = tickets.filter(function (t) { return t.stylist === id || t.assistant === id; });
      var serv = 0, prod = 0;
      own.forEach(function (t) {
        ticketServices(t).forEach(function (l) { serv += lineTotal(l); });
        ticketProducts(t).forEach(function (l) { prod += lineTotal(l); });
      });
      var comm = serv * rate.service / 100 + prod * rate.product / 100;
      var s = staffById(id);
      rows.push([s ? s.name : id, ars(serv), ars(serv + prod), ars(comm)]);
    });
    return rows;
  }

  function addCheckoutLine(type) {
    var k = document.getElementById(type === "service" ? "coSvc" : "coProd").value;
    var existing = checkout.lines.find(function (l) { return l.t === type && l.k === k; });
    if (existing) existing.q++;
    else checkout.lines.push({ t: type, k: k, q: 1 });
    render();
  }

  function removeCheckoutLine(i) {
    checkout.lines.splice(i, 1);
    render();
  }

  function completeCheckout() {
    var client = document.getElementById("coClient").value;
    var stylist = document.getElementById("coStylist").value;
    var assistant = document.getElementById("coAssistant").value;
    var cash = +document.getElementById("coCash").value || 0;
    var card = +document.getElementById("coCard").value || 0;
    var mobile = +document.getElementById("coMobile").value || 0;
    var total = sum(checkout.lines.map(lineTotal));
    var msg = document.getElementById("coMsg");

    if (!checkout.lines.length) { msg.textContent = t("no_lines"); return; }
    if (cash + card + mobile < total) { msg.textContent = t("insufficient"); return; }

    var seq = String(D.tickets.length + 1).padStart(3, "0");
    var payments = [];
    if (cash) payments.push({ m: "cash", a: cash });
    if (card) payments.push({ m: "card", a: card });
    if (mobile) payments.push({ m: "mobile", a: mobile });

    D.tickets.push({
      date: state.today, seq: seq, client: client, stylist: stylist, assistant: assistant,
      lines: checkout.lines.slice(), payments: payments
    });
    checkout.lines.forEach(function (l) {
      if (l.t === "product" && D.products[l.k]) {
        D.products[l.k].stock = Math.max((D.products[l.k].stock || 0) - l.q, 0);
      }
    });
    var c = clientById(client);
    if (c) {
      if (c.visits.indexOf(state.today) === -1) c.visits.push(state.today);
    }
    checkout = { client: "", stylist: "", assistant: "", lines: [], payments: {} };
    save();
    msg.textContent = t("saved");
    toast(t("saved"));
    sec = "sales";
    render();
  }

      var dueRows = [[t("client"), t("care_last_visit"), t("care_days_since"), t("visits")]];

  /* ------------------------- Analytics ------------------------- */

  function bucketsFor(period) {
    var out = [];
    if (period === "daily") {
      for (var i = 13; i >= 0; i--) {
        var d = addDays(state.today, -i);
        out.push({ label: d.slice(5), from: d, to: d });
      }
    } else if (period === "weekly") {
      for (var j = 7; j >= 0; j--) {
        var ws = addDays(state.weekStart, -7 * j);
        out.push({ label: "W" + isoWeek(ws), from: ws, to: addDays(ws, 6) });
      }
    } else {
      for (var k = 5; k >= 0; k--) {
        var m = shiftMonth(state.today.slice(0, 7), -k);
        out.push({ label: MONTHS_SHORT()[+m.slice(5, 7) - 1], from: m + "-01", to: monthEnd(m) });
      }
    }
    return out;
  }

  function bucketStats(b) {
    var tickets = D.tickets.filter(function (t) { return t.date >= b.from && t.date <= b.to; });
    var revenue = sum(tickets.map(ticketTotal));
    var newClients = D.clients.filter(function (c) { return c.first_visit >= b.from && c.first_visit <= b.to; }).length;
    return { revenue: revenue, tickets: tickets.length, newClients: newClients, avg: tickets.length ? Math.round(revenue / tickets.length) : 0 };
  }

  function weekLabel(d) { return "W" + isoWeek(d); }

  function periodSeg() {
    return '<div class="seg">' +
      '<button class="seg-btn' + (analyticsPeriod === "daily" ? " active" : "") + '" onclick="Lumiere.setAnalyticsPeriod(\'daily\')">' + t("daily") + '</button>' +
      '<button class="seg-btn' + (analyticsPeriod === "weekly" ? " active" : "") + '" onclick="Lumiere.setAnalyticsPeriod(\'weekly\')">' + t("weekly") + '</button>' +
      '<button class="seg-btn' + (analyticsPeriod === "monthly" ? " active" : "") + '" onclick="Lumiere.setAnalyticsPeriod(\'monthly\')">' + t("monthly") + '</button></div>';
  }

  /* ------------------------- Custom analytics engine ------------------------- */

  var METRICS = {
    revenue: { money: true },
    visits: { money: false },
    avg_ticket: { money: true },
    returning: { money: false },
    new_clients: { money: false },
    product_qty: { money: false },
    commission: { money: true },
    services_rev: { money: true },
    products_rev: { money: true },
    returning_rate: { money: false },
    avg_frequency: { money: false }
  };

  var WEEKDAY_KEYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];

  function ticketCommission(t) {
    var r = D.commissionRates[t.stylist] || { service: 0, product: 0 };
    var a = D.commissionRates[t.assistant] || { service: 0, product: 0 };
    var sv = sum(ticketServices(t).map(lineTotal));
    var pr = sum(ticketProducts(t).map(lineTotal));
    return Math.round(sv * r.service / 100 + pr * r.product / 100 + sv * a.service / 100 + pr * a.product / 100);
  }

  function distinctClients(tickets) {
    var seen = {};
    tickets.forEach(function (t) { seen[t.client] = true; });
    return Object.keys(seen).length;
  }

  function metricValue(metric, tickets, from, to) {
    var rev = sum(tickets.map(ticketTotal));
    switch (metric) {
      case "revenue": return rev;
      case "visits": return tickets.length;
      case "avg_ticket": return tickets.length ? Math.round(rev / tickets.length) : 0;
      case "returning": return tickets.filter(isReturning).length;
      case "new_clients":
        if (from && to) return D.clients.filter(function (c) { return c.first_visit >= from && c.first_visit <= to; }).length;
        return tickets.filter(function (t) { var c = clientById(t.client); return !!(c && c.first_visit === t.date); }).length;
      case "product_qty": return sum(tickets.map(function (t) { return sum(ticketProducts(t).map(function (l) { return l.q; })); }));
      case "commission": return sum(tickets.map(ticketCommission));
      case "services_rev": return sum(tickets.map(function (t) { return sum(ticketServices(t).map(lineTotal)); }));
      case "products_rev": return sum(tickets.map(function (t) { return sum(ticketProducts(t).map(lineTotal)); }));
      case "returning_rate":
        return tickets.length ? Math.round(tickets.filter(isReturning).length / tickets.length * 100) : 0;
      case "avg_frequency": {
        var dc = distinctClients(tickets);
        return dc ? Math.round(tickets.length / dc * 10) / 10 : 0;
      }
    }
    return 0;
  }

  function passesFilters(t, q) {
    if (q.staff && t.stylist !== q.staff && t.assistant !== q.staff) return false;
    if (q.gender) {
      var c = clientById(t.client);
      if (!c || c.gender_line !== q.gender) return false;
    }
    if (q.payment && !t.payments.some(function (p) { return p.m === q.payment; })) return false;
    return true;
  }

  function dataRange() {
    var min = D.tickets.reduce(function (a, t) { return t.date < a ? t.date : a; }, state.today);
    return { from: min, to: state.today };
  }

  function allBuckets() {
    var min = dataRange().from;
    if (daysBetween(min, state.today) <= 45) return bucketsFor("daily").filter(function (b) { return b.from >= min; });
    var out = [];
    var start = addDays(min, -((new Date(min + "T00:00:00").getDay() + 6) % 7));
    while (start <= state.today) {
      out.push({ label: "W" + isoWeek(start), from: start, to: addDays(start, 6) });
      start = addDays(start, 7);
    }
    return out;
  }

  function customBuckets(from, to) {
    if (!from || !to || from > to) return [];
    var out = [];
    if (daysBetween(from, to) <= 45) {
      for (var d = from; d <= to; d = addDays(d, 1)) out.push({ label: d.slice(5), from: d, to: d });
    } else {
      var start = addDays(from, -((new Date(from + "T00:00:00").getDay() + 6) % 7));
      while (start <= to) {
        out.push({ label: "W" + isoWeek(start), from: start, to: addDays(start, 6) });
        start = addDays(start, 7);
      }
    }
    return out;
  }

  function queryRange(q) {
    var buckets = q.period === "all" ? allBuckets() : (q.period === "custom" ? customBuckets(q.from, q.to) : bucketsFor(q.period));
    if (!buckets.length) return { buckets: [], from: state.today, to: state.today };
    return { buckets: buckets, from: buckets[0].from, to: buckets[buckets.length - 1].to };
  }

  function categoricalGroups(q, tickets, dim) {
    var map = {};
    function add(key, label, ticket, order) {
      if (key == null || key === "") return;
      if (!map[key]) map[key] = { label: label, tickets: [], order: order || 0 };
      map[key].tickets.push(ticket);
    }
    tickets.forEach(function (tk) {
      var wi = (new Date(tk.date + "T00:00:00").getDay() + 6) % 7;
      if (dim === "weekday") {
        add(String(wi), t(WEEKDAY_KEYS[wi]), tk, wi);
      } else if (dim === "staff") {
        var s = staffById(tk.stylist);
        add(tk.stylist, s ? s.name : tk.stylist, tk);
      } else if (dim === "gender") {
        var c = clientById(tk.client);
        add(c ? c.gender_line : "unknown", c ? t(c.gender_line) : "?", tk);
      } else if (dim === "client") {
        var cl = clientById(tk.client);
        add(tk.client, cl ? cl.name : tk.client, tk);
      } else if (dim === "service") {
        ticketServices(tk).forEach(function (l) { add(l.k, svcName(l.k), tk); });
      } else if (dim === "product") {
        ticketProducts(tk).forEach(function (l) { add(l.k, prodName(l.k), tk); });
      } else if (dim === "payment") {
        tk.payments.forEach(function (p) { add(p.m, t(p.m), tk); });
      }
    });
    var groups = Object.keys(map).map(function (k) {
      return { label: map[k].label, tickets: map[k].tickets, order: map[k].order, value: metricValue(q.metric, map[k].tickets, null, null) };
    });
    if (dim === "weekday") groups.sort(function (a, b) { return a.order - b.order; });
    else {
      groups.sort(function (a, b) { return b.value - a.value; });
      groups = groups.slice(0, q.limit || 10);
    }
    return groups;
  }

  function analyticsGroups(q) {
    var range = queryRange(q);
    var tickets = D.tickets.filter(function (t) { return t.date >= range.from && t.date <= range.to && passesFilters(t, q); });
    var dim = q.dimension;
    if (dim === "day" || dim === "week" || dim === "month") {
      return range.buckets.map(function (b) {
        var bt = tickets.filter(function (t) { return t.date >= b.from && t.date <= b.to; });
        return { label: b.label, value: metricValue(q.metric, bt, b.from, b.to), tickets: bt, from: b.from, to: b.to, order: 0 };
      });
    }
    return categoricalGroups(q, tickets, dim);
  }

  function compareSplit(q, group) {
    var tickets = group.tickets;
    var out = {};
    if (q.compare === "new_ret") {
      out[t("new_clients")] = metricValue("new_clients", tickets, group.from, group.to);
      out[t("returning_clients")] = metricValue("returning", tickets, group.from, group.to);
      return out;
    }
    tickets.forEach(function (tk) {
      var keys;
      if (q.compare === "payment") keys = tk.payments.map(function (p) { return t(p.m); });
      else if (q.compare === "gender") { var c = clientById(tk.client); keys = [c ? t(c.gender_line) : t("womens")]; }
      else if (q.compare === "staff") { var s = staffById(tk.stylist); keys = [s ? s.name : tk.stylist]; }
      else if (q.compare === "group") keys = ticketServices(tk).map(function (l) { var g = (D.services[l.k] || {}).group || "other"; return t("group_" + g); });
      else keys = [t("pending")];
      var v = metricValue(q.metric, [tk], null, null);
      keys.forEach(function (k) { out[k] = (out[k] || 0) + v; });
    });
    return out;
  }

  function compareSeries(q, groups) {
    var splitKeys = [], seriesMap = {};
    groups.forEach(function (g) {
      var sp = compareSplit(q, g);
      Object.keys(sp).forEach(function (k) { if (splitKeys.indexOf(k) === -1) splitKeys.push(k); });
      seriesMap[g.label] = sp;
    });
    return splitKeys.map(function (k) {
      return { name: k, values: groups.map(function (g) { return seriesMap[g.label][k] || 0; }), color: colorFor(splitKeys.indexOf(k)) };
    });
  }

  function heatmapChartForQuery(q) {
    var range = queryRange(q);
    var tickets = D.tickets.filter(function (t) { return t.date >= range.from && t.date <= range.to && passesFilters(t, q); });
    var dayT = { mon: t("mon"), tue: t("tue"), wed: t("wed"), thu: t("thu"), fri: t("fri"), sat: t("sat"), sun: t("sun") };
    var weeks = {};
    tickets.forEach(function (t) { weeks[weekLabel(t.date)] = true; });
    var weekOrder = Object.keys(weeks).sort(function (a, b) { return +a.slice(1) - +b.slice(1); });
    var rows = WEEKDAY_KEYS.map(function (d) { return { label: dayT[d], values: weekOrder.map(function () { return 0; }) }; });
    tickets.forEach(function (t) {
      var wi = weekOrder.indexOf(weekLabel(t.date));
      var di = (new Date(t.date + "T00:00:00").getDay() + 6) % 7;
      if (wi > -1) rows[di].values[wi] += metricValue(q.metric, [t], null, null);
    });
    return heatmapChart(rows, weekOrder, {});
  }

    var isMoney = METRICS[q.metric] && METRICS[q.metric].money;
    var fv = function (v) {
      if (isMoney) return ars(v);
      if (q.metric === "avg_frequency") return String(v);
      return fmt(v);
    };
    if (q.chart === "heatmap") {
      return '<div class="card chart-card"><h3>' + esc(queryTitle(q)) + '</h3>' + heatmapChartForQuery(q) + '</div>';
    }
    var groups = analyticsGroups(q);
    if (!groups.length) return '<div class="card"><h3>' + t("no_results") + '</h3></div>';
    var labels = groups.map(function (g) { return g.label; });
    var values = groups.map(function (g) { return g.value; });
    var total = sum(values);
    var timeDim = ["day", "week", "month"].indexOf(q.dimension) > -1;
    var period = (q.period === "all" || q.period === "custom") ? "daily" : q.period;

    var html = '<div class="card chart-card"><h3>' + esc(queryTitle(q)) + '</h3>';
    if (q.compare) {
      var series = compareSeries(q, groups);
      html += multiBarChart(labels, series, { stacked: timeDim, fmt: fv });
    } else if (q.chart === "donut") {
      html += donutChart(groups.map(function (g) { return { label: g.label, value: g.value, valueText: fv(g.value) }; }));
    } else if (q.chart === "bars-h" || (!timeDim && q.chart !== "bars" && q.chart !== "line")) {
      html += barRows(groups.map(function (g) { return { label: g.label, value: g.value, valueText: fv(g.value) }; }), { period: period });
    } else {
      html += timeChart(labels, values, { type: q.chart === "line" ? "line" : "bars", period: period, id: "aq_" + (q.id || "draft") });
    }
    html += '</div>';

    var trows = [[t("metric_" + q.metric), t("total"), "%"]];
    groups.forEach(function (g) {
      trows.push([esc(g.label), fv(g.value), (total ? Math.round(g.value / total * 100) : 0) + "%"]);
    });
    html += table(trows, { numCols: [1, 2] });
    return html;
  }

  /* ------------------------- Clock & open/closed ------------------------- */

  function toMin(hm) {
    var p = String(hm || "00:00").split(":");
    return (+p[0]) * 60 + (+p[1] || 0);
  }
  function isOpenNow() {
    var s = D.settings;
    if (!s.nightCloseEnabled) return true;
    var now = new Date();
    if ((s.closedDays || []).indexOf(now.getDay()) > -1) return false;
    var hm = now.getHours() * 60 + now.getMinutes();
    return hm >= toMin(s.openTime) && hm < toMin(s.closeTime);
  }
  function nextOpenLabel() {
    var s = D.settings;
    var open = s.openTime;
    var now = new Date();
    var dow = now.getDay();
    for (var i = 0; i < 8; i++) {
      var d = (dow + i) % 7;
      if (s.closedDays.indexOf(d) === -1) {
        if (i === 0 && toMin(s.closeTime) > now.getHours() * 60 + now.getMinutes()) {
          return t("opens_at") + " " + open;
        }
        if (i === 0) return t("opens_at") + " " + open + " " + t(DAY_KEYS[d]);
        return t(DAY_KEYS[d]) + " " + open;
      }
    }
    return open;
  }

  function updateClock() {
    var now = new Date();
    var hm = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
    var hms = hm + ":" + pad2(now.getSeconds());
    var el = document.getElementById("clock");
    if (el) el.textContent = hms;
    var de = document.getElementById("clockDate");
    if (de) {
      try { de.textContent = now.toLocaleDateString(lang === "es" ? "es-AR" : "en-US", { weekday: "short", day: "numeric", month: "short" }); }
      catch (e) { de.textContent = now.toLocaleDateString(); }
    }
    var op = document.getElementById("openPill");
    if (op) {
      var open = isOpenNow() || forceOpen;
      op.textContent = open ? t("now_open") : t("now_closed");
      op.className = "pill " + (open ? "open" : "closed");
    }
    var ov = document.getElementById("ovClock");
    if (ov) ov.textContent = hms;
    var ovDate = document.getElementById("ovDate");
    if (ovDate) {
      try { ovDate.textContent = now.toLocaleDateString(lang === "es" ? "es-AR" : "en-US", { weekday: "long", day: "numeric", month: "long" }); }
      catch (e) {}
    }
    var ovOpen = document.getElementById("ovOpenAt");
    if (ovOpen) ovOpen.textContent = nextOpenLabel();
    updateOverlay();
  }

  function updateOverlay() {
    var ov = document.getElementById("closedOverlay");
    if (!ov) return;
    var show = !(isOpenNow() || forceOpen);
    ov.style.display = show ? "flex" : "none";
    var fb = document.getElementById("ovForceBtn");
    var rb = document.getElementById("ovResetBtn");
    if (fb) fb.style.display = (canEdit() && show && !forceOpen) ? "" : "none";
    if (rb) rb.style.display = (canEdit() && show && forceOpen) ? "" : "none";
  }

    var el = document.getElementById("view");
    if (renderers[sec]) el.innerHTML = renderers[sec]();

      if (svg) {
        Array.prototype.slice.call(n.childNodes).forEach(function (c) {

        n.textContent = txt;

    });

    var langEl = document.getElementById("lang");

    var dayEl = document.getElementById("dayLabel");

  /* ------------------------- CSV export ------------------------- */

  function csvEscape(s) {
    s = String(s == null ? "" : s);
    if (/[",\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function downloadFile(name, text, mime) {
    var type = mime || "text/csv;charset=utf-8;";
    var blob = new Blob([text], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 200);
  }

  function buildSalesCSV() {
    var rows = [["Date", "Seq", "Client", "Client ID", "Stylist", "Assistant", "Items", "Total ARS", "Payment"]];
    D.tickets.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (tk) {
      var c = clientById(tk.client), s = staffById(tk.stylist), as = staffById(tk.assistant);
      var items = tk.lines.map(function (l) {
        var n = l.t === "service" ? svcName(l.k) : prodName(l.k);
        return n + " x" + l.q;
      }).join("; ");
      var pay = tk.payments.map(function (p) { return t(p.m) + " " + p.a; }).join(" + ");
      rows.push([tk.date, tk.seq, c ? c.name : tk.client, tk.client, s ? s.name : tk.stylist, as ? as.name : "", items, ticketTotal(tk), pay]);
    });
    return rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\n");
  }

    });

    push("## Products (" + Object.keys(D.products).length + ")");
    push("| Key | Name | Stock | Reorder | Price ARS |");
    push("|---|---|---|---|---|");
    Object.keys(D.products).forEach(function (k) {
      var p = D.products[k];
      push("| " + k + " | " + prodName(k) + " | " + p.stock + " | " + p.reorder + " | " + p.price_ars + " |");
    });

    var sales = D.tickets.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    push("## Sales (" + sales.length + ")");
    push("| Date | Seq | Client | Stylist | Total ARS | Items |");
    push("|---|---|---|---|---|---|");
    sales.forEach(function (tk) {
      var c = clientById(tk.client), s = staffById(tk.stylist);
      var items = tk.lines.map(function (l) {
        return (l.t === "service" ? svcName(l.k) : prodName(l.k)) + " x" + l.q;
      }).join(", ");
      push("| " + tk.date + " | " + tk.seq + " | " + (c ? c.name : tk.client) + " | " + (s ? s.name : tk.stylist) + " | " + ticketTotal(tk) + " | " + items + " |");
    });

    push("## Appointments (" + D.appointments.length + ")");
    push("| Date | Time | Client | Stylist | Service | Status |");
    push("|---|---|---|---|---|---|");
    D.appointments.slice().sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? -1 : 1; }).forEach(function (a) {
      var c = clientById(a.client), s = staffById(a.stylist);
      push("| " + a.date + " | " + a.time + " | " + (c ? c.name : a.client) + " | " + (s ? s.name : a.stylist) + " | " + svcName(a.service) + " | " + a.status + " |");
    });

    return L.join("\n");
  }

  /* ------------------------- window.Lumiere API ------------------------- */

  window.Lumiere = {
    navigate: navigate,

    addCheckoutLine: addCheckoutLine,
    removeCheckoutLine: removeCheckoutLine,
    completeCheckout: completeCheckout,

    exportCSV: function () { downloadFile("lumiere-sales.csv", buildSalesCSV()); },
    exportClientsCSV: function () { downloadFile("lumiere-clients.csv", buildClientsCSV()); },
    exportStaffCSV: function () { downloadFile("lumiere-staff.csv", buildStaffCSV()); },
    exportProductsCSV: function () { downloadFile("lumiere-products.csv", buildProductsCSV()); },

    exportBackup: function () { downloadFile("lumiere-backup.json", buildBackupJSON(), "application/json"); },
    exportMarkdown: function () { downloadFile("lumiere-records.md", buildMarkdown(), "text/markdown;charset=utf-8"); },

    importBackup: function () {
      var input = document.getElementById("dataImport");
      var file = input && input.files && input.files[0];
      var msg = document.getElementById("dataMsg");
      if (!file) { if (msg) msg.textContent = t("data_pick_file"); return; }
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var parsed = JSON.parse(ev.target.result);
          var data = parsed.data || parsed;
          if (!data.clients || !data.tickets || !data.staff || !data.services || !data.products) throw new Error("shape");
          if (!data.settings || !data.meta) throw new Error("shape");
          D = data;
          if (parsed.analyticsQueries && Array.isArray(parsed.analyticsQueries)) {
            analyticsQueries = clone(parsed.analyticsQueries);
            saveQueries();
          }
          state.today = D.meta.today; state.weekStart = D.meta.weekStart; state.weekEnd = D.meta.weekEnd;
          editTarget = null; checkout = { client: "", stylist: "", assistant: "", lines: [], payments: {} };
          save();
          if (msg) msg.textContent = t("data_restored");
          render(); toast(t("data_restored"));
        } catch (e) {
          if (msg) msg.textContent = t("data_bad_file");
        }
      };
      reader.readAsText(file);
    },
    resetData: function () {
      if (!confirm(t("data_reset_confirm"))) return;
      D = clone(SEED);
      analyticsQueries = null;
      apptViewDate = "";
      state.today = D.meta.today; state.weekStart = D.meta.weekStart; state.weekEnd = D.meta.weekEnd;
      editTarget = null; checkout = { client: "", stylist: "", assistant: "", lines: [], payments: {} };
      save(); render(); toast(t("data_reset_done"));
    },

    restockProduct: function (k) {
      var p = D.products[k];
      if (!p) return;
      p.stock = Math.max(p.reorder || D.settings.lowStockDefault || 5, 1) * 2;
      save(); render(); toast(t("restocked"));
    },

    startAppointmentForm: function (mode, id) { editTarget = { kind: "appointment", mode: mode || "add", id: id || null }; render(); },
    saveAppointment: function () {
      var date = inputVal("apDate", "").trim();
      var time = inputVal("apTime", "").trim();
      var client = inputVal("apClient", "");
      var service = inputVal("apSvc", "");
      var stylist = inputVal("apStylist", "");
      var msg = document.getElementById("apMsg");
      var fail = function (m) { if (msg) msg.textContent = m; };
      if (!date || !time) return fail(t("appt_need_date_time"));
      var open = toMin(D.settings.openTime), close = toMin(D.settings.closeTime), tm = toMin(time);
      if (tm < open || tm > close) return fail(t("appt_outside_hours"));
      var exclude = editTarget.id || null;
      var conflict = D.appointments.some(function (a) {
        return a.id !== exclude && a.date === date && a.time === time && a.stylist === stylist && a.status !== "cancelled";
      });
      if (conflict) return fail(t("appt_conflict"));
      if (editTarget.id) {
        var a = appointmentById(editTarget.id);
        if (a) {
          a.date = date; a.time = time; a.client = client; a.service = service; a.stylist = stylist;
          if (editTarget.mode === "edit") a.status = inputVal("apStatus", a.status);
        }
      } else {
        D.appointments.push({ id: "app-" + Date.now(), date: date, time: time, client: client, stylist: stylist, service: service, status: "booked" });
      }
      apptViewDate = date;
      save(); editTarget = null; render(); toast(t("saved_changes"));
    },
    setAppointmentStatus: function (id, status) {
      var a = appointmentById(id);
      if (!a) return;
      a.status = status;
      save(); render();
    },
    cancelAppointment: function (id) { this.setAppointmentStatus(id, "cancelled"); },

    filterClients: function (q) {
      searchQ = q || "";
      var rows = document.querySelectorAll(".client-row");
      rows.forEach(function (r) {
        var name = (r.getAttribute("data-name") || "").toLowerCase();
        var id = (r.getAttribute("data-id") || "").toLowerCase();
        var m = !searchQ || name.indexOf(searchQ) > -1 || id.indexOf(searchQ) > -1;
        r.style.display = m ? "" : "none";
      });
    },

    startClientForm: function (mode, id) { editTarget = { kind: "client", mode: mode || "add", id: id || null }; render(); },
    startStaffForm: function (mode, id) { editTarget = { kind: "staff", mode: mode || "add", id: id || null }; render(); },
    startServiceForm: function (mode, id) { editTarget = { kind: "service", mode: mode || "add", id: id || null }; render(); },
    startProductForm: function (mode, id) { editTarget = { kind: "product", mode: mode || "add", id: id || null }; render(); },
    cancelForm: function () { editTarget = null; render(); },

    saveClient: function () {
      var name = inputVal("cName", "").trim();
      if (!name) return;
      var gender = inputVal("cGender", "women");
      var phone = inputVal("cPhone", "").trim();
      if (editTarget.mode === "edit") {
        var c = clientById(editTarget.id);
        if (c) { c.name = name; c.gender_line = gender; c.phone = phone; c.status = inputVal("cStatus", "active"); }
      } else {
        D.clients.push({ id: nextClientId(), name: name, gender_line: gender, phone: phone, first_visit: state.today, visits: [], status: "active" });
      }
      save(); editTarget = null; render(); toast(t("saved_changes"));
    },
    deleteClient: function (id) {
      var c = clientById(id);
      if (!confirmDelete(c ? c.name : id)) return;
      D.clients = D.clients.filter(function (x) { return x.id !== id; });
      save(); render(); toast(t("deleted"));
    },

    saveStaff: function () {
      var name = inputVal("sName", "").trim();
      if (!name) return;
      var r = inputVal("sRole", "stylist");
      var sh = inputVal("sShift", "");
      var st = inputVal("sStatus", "active");
      if (editTarget.mode === "edit") {
        var s = staffById(editTarget.id);
        if (s) { s.name = name; s.role = r; s.shift = sh; s.status = st; }
      } else {
        var id = r + "-" + (String(D.staff.length + 1).padStart(3, "0")) + "-" + slug(name);
        D.staff.push({ id: id, name: name, role: r, shift: sh, status: st });
      }
      save(); editTarget = null; render(); toast(t("saved_changes"));
    },
    deleteStaff: function (id) {
      var s = staffById(id);
      if (!confirmDelete(s ? s.name : id)) return;
      D.staff = D.staff.filter(function (x) { return x.id !== id; });
      delete D.commissionRates[id];
      save(); render(); toast(t("deleted"));
    },

    saveService: function () {
      var nameEn = inputVal("svNameEn", "").trim();
      var nameEs = inputVal("svNameEs", "").trim();
      if (!nameEn) return;
      var price = numVal("svPrice", 0);
      var grp = inputVal("svGroup", "hair");
      if (editTarget.mode === "edit") {
        var s = D.services[editTarget.id];
        if (s) { s.name_en = nameEn; s.name_es = nameEs || nameEn; s.price_ars = price; s.group = grp; }
      } else {
        var key = slug(nameEn) || "svc-" + (Object.keys(D.services).length + 1);
        while (D.services[key]) key += "-" + Math.floor(Math.random() * 90 + 10);
        D.services[key] = { name_en: nameEn, name_es: nameEs || nameEn, group: grp, price_ars: price };
      }
      save(); editTarget = null; render(); toast(t("saved_changes"));
    },
    deleteService: function (k) {
      if (!confirmDelete(svcName(k))) return;
      delete D.services[k];
      save(); render(); toast(t("deleted"));
    },

    saveProduct: function () {
      var nameEn = inputVal("pNameEn", "").trim();
      var nameEs = inputVal("pNameEs", "").trim();
      if (!nameEn) return;
      var price = numVal("pPrice", 0);
      var stock = numVal("pStock", 0);
      var reorder = numVal("pReorder", D.settings.lowStockDefault || 5);
      if (editTarget.mode === "edit") {
        var p = D.products[editTarget.id];
        if (p) { p.name_en = nameEn; p.name_es = nameEs || nameEn; p.price_ars = price; p.stock = stock; p.reorder = reorder; }
      } else {
        var key = slug(nameEn) || "prod-" + (Object.keys(D.products).length + 1);
        while (D.products[key]) key += "-" + Math.floor(Math.random() * 90 + 10);
        D.products[key] = { name_en: nameEn, name_es: nameEs || nameEn, price_ars: price, stock: stock, reorder: reorder };
      }
      save(); editTarget = null; render(); toast(t("saved_changes"));
    },
    deleteProduct: function (k) {
      if (!confirmDelete(prodName(k))) return;
      delete D.products[k];
      save(); render(); toast(t("deleted"));
    },

    saveRates: function () {
      D.staff.filter(function (s) { return s.role === "stylist" || s.role === "assistant"; }).forEach(function (s) {
        var sv = parseFloat(inputVal("rate_" + s.id + "_s", "0"));
        var pv = parseFloat(inputVal("rate_" + s.id + "_p", "0"));
        D.commissionRates[s.id] = { service: isNaN(sv) ? 0 : sv, product: isNaN(pv) ? 0 : pv };
      });
      save(); render(); toast(t("saved_changes"));
    },

    toggleReceptionistSection: function (secKey, checked) {
      var list = D.settings.receptionistSections;
      if (!Array.isArray(list)) list = D.settings.receptionistSections = PUBLIC_SECTIONS.slice();
      var idx = list.indexOf(secKey);
      if (checked && idx === -1) list.push(secKey);
      if (!checked && idx > -1) list.splice(idx, 1);
      save();
    },

    setAnalyticsPeriod: function (p) {
      analyticsPeriod = p;
      if (analyticsDraft) analyticsDraft.period = p;
      render();
    },

    syncPeriod: function (p) {
      readDraftFromForm();
      analyticsDraft.period = p;
      render();
    },

    runAnalytics: function () {
      readDraftFromForm();
      lastQueryResult = analyticsGroups(analyticsDraft);
      render();
    },
    runNaturalQuery: function () {
      var input = document.getElementById("nlInput");
      var text = (input ? input.value : "").trim();
      if (!text) return;
      var res = NaturalQuery.parse(text, D, lang);
      if (!res || res.type !== "query") {
        nlText = text;
        render();
        var msg = document.getElementById("nlMsg");
        if (msg) msg.innerHTML = '<p class="muted">' + t("nl_unknown") + '</p><div class="nl-suggestions">' +
          nlSuggestList().map(function (x, i) {
            return '<button class="chip" onclick="Lumiere.askNatural(' + i + ')">' + esc(x) + '</button>';
          }).join("") + '</div>';
        return;
      }
      nlText = text;
      analyticsDraft = res.q;
      lastQueryResult = analyticsGroups(res.q);
      render();
      var msg2 = document.getElementById("nlMsg");
      if (msg2) msg2.innerHTML = '<p class="nl-confirm">' + esc(res.summary) + '</p>';
      toast(res.summary);
    },
    askNatural: function (i) {
      var list = nlSuggestList();
      if (!list[i]) return;
      var input = document.getElementById("nlInput");
      if (input) input.value = list[i];
      this.runNaturalQuery();
    },
    startVoice: function () {
      try {
        if (!NaturalQuery.speechSupported()) { toast(t("nl_voice_unsupported")); return; }
        var mic = document.getElementById("nlMic");
        if (mic) mic.textContent = "⏺ " + t("nl_listening");
        NaturalQuery.recognize(lang, function (txt) {
          var input = document.getElementById("nlInput");
          if (input) input.value = txt;
          var m = document.getElementById("nlMsg");
          if (m) m.innerHTML = "";
          Lumiere.runNaturalQuery();
        }, function () {
          var micEl = document.getElementById("nlMic");
          if (micEl) micEl.textContent = "🎤 " + t("nl_mic");
        }, function () { toast(t("nl_error")); });
      } catch (e) { toast(t("nl_error")); }
    },
    saveAnalyticsQuery: function () {
      readDraftFromForm();
      var q = { id: "q" + Date.now() };
      ["metric", "dimension", "compare", "chart", "period", "from", "to", "staff", "gender", "payment", "limit"].forEach(function (k) { q[k] = analyticsDraft[k]; });
      if (!analyticsQueries) analyticsQueries = [];
      analyticsQueries.push(q);
      saveQueries();
      render();
    },
    editAnalyticsQuery: function (i) {
      var q = analyticsQueries[i];
      if (!q) return;
      analyticsDraft = {};
      ["metric", "dimension", "compare", "chart", "period", "from", "to", "staff", "gender", "payment", "limit"].forEach(function (k) { analyticsDraft[k] = q[k]; });
      render();
    },
    removeAnalyticsQuery: function (i) {
      analyticsQueries.splice(i, 1);
      saveQueries();
      render();
    },
    clearAnalyticsQueries: function () {
      analyticsQueries = [];
      saveQueries();
      render();
    },
    loadStarterPack: function (period) {
      if (!analyticsQueries) analyticsQueries = loadQueries();
      var has = {};
      analyticsQueries.forEach(function (q) { has[q.id] = true; });
      defaultQueries().forEach(function (q) {
        if (period !== "all" && q.period !== period) return;
        if (has[q.id]) return;
        analyticsQueries.push(q);
        has[q.id] = true;
      });
      saveQueries();
      render();
    },
    exportQueryCSV: function () {
      if (!lastQueryResult || !lastQueryResult.length) return;
      var rows = [["Label", "Value"]].concat(lastQueryResult.map(function (g) { return [g.label, g.value]; }));
      downloadFile("lumiere-query.csv", rows.map(function (r) { return r.map(csvEscape).join(","); }).join("\n"));
    },

    saveHours: function () {
      var s = D.settings;
      s.openTime = inputVal("rOpen", s.openTime);
      s.closeTime = inputVal("rClose", s.closeTime);
      s.closedDays = [];
      for (var d = 0; d < 7; d++) {
        var el = document.getElementById("rDay" + d);
        if (el && el.checked) s.closedDays.push(d);
      }
      var n = document.getElementById("rNight");
      s.nightCloseEnabled = n ? n.checked : true;
      save(); render();
    },
    togglePredefined: function (key, checked) {
      var r = D.settings.predefinedRules.find(function (x) { return x.key === key; });
      if (r) r.enabled = !!checked;
      save();
    },
    toggleCustomRule: function (i, checked) {
      if (D.settings.customRules[i]) D.settings.customRules[i].enabled = !!checked;
      save();
    },
    removeCustomRule: function (i) {
      D.settings.customRules.splice(i, 1);
      save(); render();
    },
    addCustomRule: function () {
      var name = inputVal("crName", "").trim();
      var value = inputVal("crValue", "").trim();
      if (!name) return;
      D.settings.customRules.push({ name: name, value: value, enabled: true });
      save(); render();
    },

    forceOpen: function () { forceOpen = true; updateClock(); },
    resetForceOpen: function () { forceOpen = false; updateClock(); }
  };

  /* ------------------------- listeners ------------------------- */

  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "apptDate") {
      apptViewDate = e.target.value;
      render();
    }
  });

  document.getElementById("role").addEventListener("change", function (e) {
    role = e.target.value;
    if (role === "receptionist" && !canSee(sec)) sec = "today";
    try { localStorage.setItem("lumiere_role", role); } catch (err) {}
    render();
  });

  document.getElementById("lang").addEventListener("click", function () {
    lang = lang === "en" ? "es" : "en";
    try { localStorage.setItem("lumiere_lang", lang); } catch (err) {}
    render();
  });

  document.querySelectorAll(".nav-item").forEach(function (b) {
    b.addEventListener("click", function () { navigate(b.getAttribute("data-sec")); });
  });

  setInterval(updateClock, 1000);

  if (typeof navigator !== "undefined" && "serviceWorker" in navigator &&
      typeof location !== "undefined" &&
      (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

  render();
  updateClock();
})();
</script>
</body>
</html>
