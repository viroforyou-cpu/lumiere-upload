<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumiere POS — Dashboard</title>
  <meta name="theme-color" content="#0e0e11">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot">💎</span>
      <h1>Lumiere</h1>
    </div>
    <div class="topbar-actions">
      <div class="clock-box">
        <span class="pill" id="openPill">Open</span>
        <span class="clock" id="clock">--:--:--</span>
        <span class="day-label" id="clockDate"></span>
      </div>
      <select id="role" class="role-select" aria-label="Role">
        <option value="owner" data-i18n="role_owner">Owner</option>
        <option value="admin" data-i18n="role_admin">Administrator</option>
        <option value="receptionist" data-i18n="role_receptionist">Receptionist</option>
      </select>
      <button id="lang" class="lang-btn">ES</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav>
        <button class="nav-item" data-sec="today" data-i18n="sec_today"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Today</button>
        <button class="nav-item" data-sec="week" data-i18n="sec_week"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Week</button>
        <button class="nav-item" data-sec="month" data-i18n="sec_month"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg>Month</button>
        <hr>
        <button class="nav-item" data-sec="appointments" data-i18n="sec_appointments"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>Appointments</button>
        <button class="nav-item" data-sec="checkout" data-i18n="sec_checkout"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.5"/><circle cx="19" cy="21" r="1.5"/><path d="M2 3h2l2.6 12.4a2 2 0 002 1.6h8.9a2 2 0 002-1.6L21 7H6"/></svg>Checkout</button>
        <button class="nav-item" data-sec="clients" data-i18n="sec_clients"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>Clients</button>
        <button class="nav-item" data-sec="staff" data-i18n="sec_staff"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Staff</button>
        <button class="nav-item" data-sec="services" data-i18n="sec_services"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 16l6-12 6 12"/><path d="M9 16h6"/></svg>Services</button>
        <button class="nav-item" data-sec="products" data-i18n="sec_products"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Products</button>
        <button class="nav-item" data-sec="sales" data-i18n="sec_sales"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Sales</button>
        <button class="nav-item owner-only" data-sec="analytics" data-i18n="sec_analytics"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 4-7"/></svg>Analytics</button>
        <hr>
        <button class="nav-item owner-only" data-sec="commission" data-i18n="sec_commission"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Commission</button>
        <button class="nav-item owner-only" data-sec="reports" data-i18n="sec_reports"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Reports</button>
        <button class="nav-item owner-only" data-sec="rules" data-i18n="sec_rules"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Rules</button>
        <button class="nav-item owner-only" data-sec="data" data-i18n="sec_data"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>Data</button>
        <button class="nav-item owner-only" data-sec="care" data-i18n="sec_care"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.5-3.2-8-6.5-8-10a4.5 4.5 0 019-1.5A4.5 4.5 0 0122 11c0 3.5-3.5 6.8-8 10z"/></svg>Care</button>
      </nav>
    </aside>

    <main id="view" class="view"></main>
  </div>

  <div id="closedOverlay" class="closed-overlay" style="display:none">
    <div class="closed-card">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Lumiere</h1>
      </div>
      <div class="closed-icon"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <h2 id="ovMsg">We are closed</h2>
      <div class="closed-clock" id="ovClock">--:--:--</div>
      <div class="closed-date" id="ovDate"></div>
      <div class="closed-open" id="ovOpenAt"></div>
      <button class="btn ghost" id="ovForceBtn" onclick="Lumiere.forceOpen()">Open now (owner)</button>
      <button class="btn ghost" id="ovResetBtn" onclick="Lumiere.resetForceOpen()" style="display:none">Restore schedule</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="nl.js"></script>
  <script src="app.js"></script>
</body>
</html>
